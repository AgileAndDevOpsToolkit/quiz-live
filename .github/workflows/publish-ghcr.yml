name: Build and publish QuizLive to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# GITHUB_TOKEN suffit pour publier dans le GHCR du dépôt.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Test, build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # L'image de test est chargée sur le runner. Aucune clé admin réelle
      # n'entre dans le build : le test utilise sa propre clé factice.
      - name: Build image for tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: quizlive:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test PHP and quiz rules
        shell: bash
        run: |
          docker run --rm --entrypoint sh quizlive:ci -c \
            'find backend bin public tests -type f -name "*.php" -exec php -l {} \;'
          docker run --rm --entrypoint php quizlive:ci tests/integration.php

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
