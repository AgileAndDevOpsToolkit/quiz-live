<Directory "/var/www/html/public">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"

# Application servie sous /quiz-live/ par l'Ingress (sans rewrite-target)
Alias "/quiz-live" "/var/www/html/public"
